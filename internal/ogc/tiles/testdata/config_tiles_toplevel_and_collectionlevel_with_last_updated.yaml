---
version: 1.0.2
title: OGC API
abstract: This is an OGC API Tiles with tiles defined at both top- and collection-level, without styles
baseUrl: http://localhost:8080
serviceIdentifier: Min
license:
  name: MIT
  url: https://www.tldrlegal.com/license/mit-license
lastUpdated: "2023-09-08T12:00:00Z"
ogcApi:
  # which OGC apis to enable. Possible values: tiles, styles, features
  tiles:
    # top-level tiles
    tileServer:
      http://localhost:9090
    types:
      - vector
    supportedSrs:
      - srs: EPSG:28992
        zoomLevelRange:
          start: 0
          end: 12
      - srs: EPSG:3857
        zoomLevelRange:
          start: 0
          end: 30
    # collection-level tiles
    collections:
      - id: example
        metadata:
          title: First Example
          lastUpdated: "2023-09-10T12:00:00Z"
        tileServer:
          http://localhost:9090
        types:
          - vector
        supportedSrs:
          - srs: EPSG:3857
            zoomLevelRange:
              start: 0
              end: 30
      - id: example2
        metadata:
          title: Second Example
          lastUpdated: "2023-09-12T12:00:00Z"
        tileServer:
          http://localhost:9090
        types:
          - vector
        supportedSrs:
          - srs: EPSG:28992
            zoomLevelRange:
              start: 0
              end: 12
