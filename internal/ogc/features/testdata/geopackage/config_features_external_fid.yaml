---
version: 1.0.2
title: OGC API Features
abstract: Example dataset with external FIDs and relations between features
baseUrl: http://localhost:8080
serviceIdentifier: Feats
license:
  name: CC0
  url: https://www.tldrlegal.com/license/creative-commons-cc0-1-0-universal
ogcApi:
  features:
    datasources:
      defaultWGS84:
        geopackage:
          local:
            file: ./internal/ogc/features/datasources/geopackage/testdata/external-fid.gpkg
            fid: feature_id
            externalFid: external_fid
    collections:
      - id: ligplaatsen
        metadata:
          title: Ligplaatsen
          description: Ligplaatsen example data
      - id: standplaatsen
        filters:
          properties:
            - name: external_fid
              indexRequired: false
          cql:
            enable: true
        metadata:
          title: Standplaatsen
          description: Standplaatsen example data
      - id: standplaatsen-no-id-queryable
        tableName: standplaatsen
        filters:
          cql:
            enable: true
        metadata:
          title: Standplaatsen without an ID queryable
          description: External FID is not configured as a filter property
